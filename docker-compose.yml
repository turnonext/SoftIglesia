# LMS SaaS — Un backend Laravel + infra compartida
name: lms-saas

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - backend
    networks: [lms]

  backend: &backend_app
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - ./backend/.env
    environment:
      APP_URL: ${APP_URL:-http://localhost:${NGINX_HTTP_PORT:-8080}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      DB_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      AWS_ENDPOINT: http://minio:9000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [lms]

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${NGINX_HTTP_PORT:-8080}/api}
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    networks: [lms]

  horizon:
    <<: *backend_app
    command: php artisan horizon
    expose: []
    depends_on:
      - backend
      - redis
    networks: [lms]

  scheduler:
    <<: *backend_app
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    expose: []
    depends_on:
      - backend
      - mysql
    networks: [lms]

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-lms_saas}
      MYSQL_USER: ${DB_USERNAME:-lms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lms]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [lms]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [lms]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minio12345}
    volumes:
      - minio_data:/data
    networks: [lms]

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  frontend_node_modules:

networks:
  lms:
    driver: bridge
